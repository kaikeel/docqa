[project]
name = "docqa"
version = "0.1.0"
description = "Question answering over your own documents with verifiable citations (SQLite FTS5 + Claude)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kaikeel" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.3.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pypdf==6.21.2",
    "typer==0.27.3",
]

[project.scripts]
docqa = "docqa.cli:app"

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown docs contain illustrative snippets; only Python sources are linted/formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["docqa"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
